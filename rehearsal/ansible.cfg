# =============================================================================
# rehearsal / ansible.cfg
# =============================================================================
#
# Ansible finds this automatically when you run `ansible-playbook` from inside
# this directory. Keeping it here rather than in ~/.ansible.cfg means the
# settings travel with the repo — anyone who clones this gets the same
# behaviour instead of inheriting whatever happens to be on their machine.
# =============================================================================

[defaults]

# The inventory tuning generates. Not committed — it carries the live public IP
# and a path to your private key. The committed template is
# inventory.example.ini.
inventory = inventory.ini

roles_path = roles

# Leave host key checking ON. Turning it off is the standard lab shortcut and
# it throws away the only protection SSH has against a man-in-the-middle on
# first contact.
#
# It costs nothing here because layer 1's runbook ends by SSHing to the node,
# which already put the host key in ~/.ssh/known_hosts. If you skipped that:
#   ssh-keyscan -H <node-ip> >> ~/.ssh/known_hosts
#
# When the node is rebuilt its host key changes and SSH will refuse to connect
# until you remove the stale entry:
#   ssh-keygen -R <node-ip>
host_key_checking = True

# Print task results as readable YAML instead of a single JSON line. Makes
# diffs and error messages legible, which matters a lot when a task fails.
stdout_callback = yaml

# Show how long each task took at the end of a run. Useful for spotting the
# one task that's quietly costing a minute every time.
callbacks_enabled = profile_tasks

# Don't pester about which Python the remote uses. Ubuntu 24.04 has exactly
# one and the inventory names it explicitly anyway.
interpreter_python = auto_silent

# .retry files are a leftover from a workflow nobody uses any more.
retry_files_enabled = False

# The whole "fleet" is one node, so parallelism is academic. Left explicit
# because the day there's a second node this is the knob.
forks = 10

[privilege_escalation]

# Escalation is declared on the play (playbook.yml) rather than forced here,
# so it's visible in the file you actually read.
become        = False
become_method = sudo

[ssh_connection]

# Send module code over the existing SSH session instead of writing a temp file
# on the remote and executing it separately. Roughly halves the round trips,
# which on a 2-OCPU node over the public internet is the difference between a
# 4-minute run and a 2-minute one.
#
# Requires sudoers not to enforce `requiretty`. Ubuntu doesn't.
pipelining = True

# Reuse one TCP connection for the whole run rather than reconnecting per task.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey
