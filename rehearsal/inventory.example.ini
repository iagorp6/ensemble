# =============================================================================
# rehearsal / inventory.example.ini
# =============================================================================
#
# Template only. The real inventory.ini is GENERATED by layer 1 — don't write
# it by hand:
#
#   cd ../tuning
#   terraform output -raw ansible_inventory > ../rehearsal/inventory.ini
#
# This file exists so the shape of that handoff is visible in the repo without
# committing a live IP address and a path to somebody's private key.
#
# The inventory is the entire interface between `tuning` and `rehearsal`: an
# address, a login, and three facts Terraform already knew. Ansible could have
# queried OCI directly with a dynamic inventory plugin — that would mean a
# second set of cloud credentials and Ansible knowing something about Oracle.
# Plain text instead, so swapping OCI for anything else touches zero lines of
# this layer.
# =============================================================================

[ensemble]
podium ansible_host=203.0.113.42

[ensemble:vars]
# cloud-init's default user on OCI's Ubuntu images. Not root, and not `opc`
# (that one is Oracle Linux).
ansible_user=ubuntu
ansible_python_interpreter=/usr/bin/python3

# Terraform emits this verbatim rather than as an absolute path, so it resolves
# correctly whether Ansible runs from WSL or anywhere else.
ansible_ssh_private_key_file=~/.ssh/ensemble_ed25519

# Facts tuning knows and rehearsal would otherwise have to rediscover.
# node_public_ip becomes a TLS SAN on the K3s API certificate — without it,
# kubectl from a laptop fails certificate verification against the public IP.
node_private_ip=10.0.1.7
node_public_ip=203.0.113.42
vcn_cidr=10.0.0.0/16
