# =============================================================================
# backstage / secret-generator.yaml — the ksops generator
# =============================================================================
#
# Kustomize can call an external binary to GENERATE resources rather than read
# them from a file. This tells it to hand secrets.enc.yaml to `ksops`, which
# shells out to sops, decrypts, and emits the plaintext Secret into the build
# output — in memory, inside ArgoCD's repo-server, never on disk.
#
# The decrypted manifest exists for the duration of one sync and is never
# written anywhere a person or another process could read it.
# =============================================================================
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: overture-secrets
  annotations:
    # This annotation is what makes kustomize treat the resource as an
    # executable function rather than data. It is also exactly why the
    # repo-server has to be started with `--enable-exec` — see the security
    # note in conductor/bootstrap/values.yaml, because that flag deserves one.
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secrets.enc.yaml
