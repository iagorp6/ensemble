# =============================================================================
# backstage / secrets.example.yaml — the shape, in plaintext
# =============================================================================
#
# This file is NOT encrypted and NOT applied. It exists so the structure of
# secrets.enc.yaml is readable without a key, and so a new value can be added
# by copying a line rather than reverse-engineering the encrypted file.
#
# It contains no real values and never should. To create the encrypted file
# from scratch:
#
#     cp secrets.example.yaml /tmp/secrets.yaml
#     # edit /tmp/secrets.yaml with real values
#     sops encrypt /tmp/secrets.yaml > secrets.enc.yaml
#     shred -u /tmp/secrets.yaml          # or just rm; it was never in git
#
# To change a value in the existing encrypted file, never decrypt it to disk:
#
#     sops edit secrets.enc.yaml
#
# That decrypts into your editor, in memory, and re-encrypts on save. The
# plaintext never becomes a file that a stray `git add -A` could catch.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: overture-secrets
  namespace: overture
type: Opaque

# stringData rather than data, so values are written as plain UTF-8 instead of
# base64. Kubernetes base64-encodes them on the way in.
#
# Worth being blunt about why that matters here: base64 is ENCODING, not
# encryption. `kubectl get secret -o yaml | base64 -d` is not an attack, it's
# the documented way to read a Secret. A Kubernetes Secret committed to Git is
# a plaintext credential with an extra step — which is exactly the problem this
# layer exists to solve.
stringData:
  # Consumed by overture. It gates GET /private, and the app reports only
  # whether it is configured, never the value.
  OVERTURE_API_TOKEN: replace-me

  # Layer 6/7 will add the token Alertmanager presents to maestro here. It goes
  # in the same file because it is the same trust boundary — but note maestro
  # itself runs on a laptop, not in the cluster, so its copy lives in a local
  # .env rather than in a Kubernetes Secret. Same value, two delivery
  # mechanisms, because the two consumers are in different places.
  # MAESTRO_WEBHOOK_TOKEN: replace-me
