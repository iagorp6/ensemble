# =============================================================================
# metronome / rules / dashboard-overture.yaml
# =============================================================================
#
# A Grafana dashboard as a ConfigMap. The sidecar configured in
# metronome/grafana/values.yaml watches every namespace for ConfigMaps labelled
# `grafana_dashboard: "1"` and loads their contents.
#
# WHY THIS IS A FILE AND NOT SOMETHING SOMEBODY BUILT BY CLICKING
#
# A dashboard authored in the UI lives in Grafana's database and nowhere else.
# It cannot be reviewed, cannot be rolled back, and disappears when the pod is
# recreated — which is guaranteed here, because Grafana runs without
# persistence precisely so that nothing important can accumulate in it.
#
# As a file it gets the same treatment as everything else in this repo: a diff,
# an author, and ArgoCD putting it back if it drifts. Editing in the UI still
# works for exploring; making a change stick means committing it.
#
# The panels use only metrics `score` deliberately exposes — the counter and the
# histogram from metrics.go — plus the Loki stream for the same namespace. That
# is the whole point of the layer: metrics and logs for one moment, two panels
# apart rather than two tools apart.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-overture
  namespace: metronome
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: ensemble
  annotations:
    grafana_folder: "ensemble"
data:
  overture.json: |
    {
      "uid": "overture",
      "title": "overture",
      "tags": ["ensemble"],
      "timezone": "utc",
      "schemaVersion": 39,
      "refresh": "1m",
      "time": { "from": "now-6h", "to": "now" },
      "panels": [
        {
          "type": "timeseries",
          "title": "Request rate by status",
          "description": "From overture_requests_total. rate() rather than the raw counter, because a counter resets to zero on every pod restart and the raw value is meaningless across one.",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": { "unit": "reqps", "min": 0 },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (rate(overture_requests_total{job=\"overture\"}[5m]))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "type": "stat",
          "title": "5xx ratio (alert fires above 5%)",
          "description": "The exact expression from PrometheusRule OvertureHighErrorRate. Reading the same number the alert reads is what stops 'the dashboard looked fine' and 'the alert fired' from being different stories.",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 0.05 }
                ]
              }
            },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(overture_requests_total{job=\"overture\",status=\"5xx\"}[5m])) / sum(rate(overture_requests_total{job=\"overture\"}[5m]))"
            }
          ]
        },
        {
          "type": "stat",
          "title": "Running version",
          "description": "From overture_build_info, the gauge whose value is always 1 and whose labels carry the payload. During a rolling update two versions appear at once, which is the clearest signal that a deploy is in progress.",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 0 },
          "options": { "textMode": "name" },
          "targets": [
            {
              "refId": "A",
              "expr": "overture_build_info{job=\"overture\"}",
              "legendFormat": "{{version}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Latency percentiles",
          "description": "histogram_quantile over the _bucket series. These are INTERPOLATED from bucket boundaries, not exact — accuracy depends on the buckets straddling the real distribution. See durationBuckets in score/metrics.go.",
          "datasource": { "type": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": { "unit": "s", "min": 0 },
            "overrides": []
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(overture_request_duration_seconds_bucket{job=\"overture\"}[5m])))",
              "legendFormat": "p99"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(overture_request_duration_seconds_bucket{job=\"overture\"}[5m])))",
              "legendFormat": "p50"
            }
          ]
        },
        {
          "type": "logs",
          "title": "Logs",
          "description": "From Loki, same time range as the graphs above. Health-check lines are dropped at the Alloy agent, so what remains is requests that did something.",
          "datasource": { "type": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "options": {
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"overture\", app=\"overture\"}"
            }
          ]
        }
      ]
    }
